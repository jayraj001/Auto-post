name: autopost_ai
description: AutoPost AI – Smart Social Media Automation Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^13.0.1
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  table_calendar: ^3.0.9
  fl_chart: ^0.66.2
  image_picker: ^1.0.7
  google_sign_in: ^6.2.1
  flutter_stripe: ^10.1.1
  razorpay_flutter: ^1.3.6
  flutter_local_notifications: ^17.0.0
  flutter_reorderable_list: ^1.0.0
  intl: ^0.19.0
  hugeicons: ^0.0.7
  video_player: ^2.8.3
  path: ^1.9.0

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5

  # OAuth / Deep links
  url_launcher: ^6.2.5
  app_links: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  # retrofit_generator: ^8.1.0  # Uncomment after running build_runner

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
